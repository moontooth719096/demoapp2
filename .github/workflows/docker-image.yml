name: Build and Push Docker Image

on:
  push:
    branches: [dev]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Google env
        run: |
          echo "VITE_GoogleAPIKey=${{ secrets.VITE_GOOGLE_API_KEY }}" >> .env
          echo "VITE_GoogleClientId=${{ secrets.VITE_GOOGLE_CLIENT_ID }}" >> .env
          echo "VITE_GoogleAppId=${{ secrets.VITE_GOOGLE_APP_ID }}" >> .env

      - name: Build and push Docker image (DEV)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.dev
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/demoapp2:dev
